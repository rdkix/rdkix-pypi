name: Build wheels

on:
  workflow_dispatch:
    inputs:
      build_matrix_filter:
        description: 'Filter for builds (e.g. py37, macosx_arm64, macosx_arm64_py37)'
        required: false
        default: ''
  pull_request:
  

permissions: 
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  PYTHONUNBUFFERED: "1"

jobs:
  setup_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          FILTER="${{ github.event.inputs.build_matrix_filter }}"
          FILTER_JSON=""
          
          # Define the full matrix
          FULL_MATRIX='{
            "include": [
              {"os": "windows-2019", "python": "37", "bitness": 64, "platform_id": "win_amd64"},
              {"os": "windows-2019", "python": "38", "bitness": 64, "platform_id": "win_amd64"},
              {"os": "windows-2019", "python": "39", "bitness": 64, "platform_id": "win_amd64"},
              {"os": "windows-2019", "python": "310", "bitness": 64, "platform_id": "win_amd64"},
              {"os": "windows-2019", "python": "311", "bitness": 64, "platform_id": "win_amd64"},
              {"os": "windows-2019", "python": "312", "bitness": 64, "platform_id": "win_amd64"},
              {"os": "windows-2019", "python": "313", "bitness": 64, "platform_id": "win_amd64"},
              
              {"os": "ubuntu-latest", "python": "37", "bitness": 64, "platform_id": "manylinux_x86_64", "manylinux_image": "manylinux2014"},
              {"os": "ubuntu-latest", "python": "38", "bitness": 64, "platform_id": "manylinux_x86_64", "manylinux_image": "manylinux2014"},
              {"os": "ubuntu-latest", "python": "39", "bitness": 64, "platform_id": "manylinux_x86_64", "manylinux_image": "manylinux2014"},
              {"os": "ubuntu-latest", "python": "310", "bitness": 64, "platform_id": "manylinux_x86_64", "manylinux_image": "manylinux2014"},
              {"os": "ubuntu-latest", "python": "311", "bitness": 64, "platform_id": "manylinux_x86_64", "manylinux_image": "manylinux2014"},
              {"os": "ubuntu-latest", "python": "312", "bitness": 64, "platform_id": "manylinux_x86_64", "manylinux_image": "manylinux2014"},
              {"os": "ubuntu-latest", "python": "313", "bitness": 64, "platform_id": "manylinux_x86_64", "manylinux_image": "manylinux2014"},
              
              {"os": "macos-14", "python": "37", "bitness": 64, "platform_id": "macosx_arm64"},
              {"os": "macos-14", "python": "38", "bitness": 64, "platform_id": "macosx_arm64"},
              {"os": "macos-14", "python": "39", "bitness": 64, "platform_id": "macosx_arm64"},
              {"os": "macos-14", "python": "310", "bitness": 64, "platform_id": "macosx_arm64"},
              {"os": "macos-14", "python": "311", "bitness": 64, "platform_id": "macosx_arm64"},
              {"os": "macos-14", "python": "312", "bitness": 64, "platform_id": "macosx_arm64"},
              {"os": "macos-14", "python": "313", "bitness": 64, "platform_id": "macosx_arm64"},
              
              {"os": "macos-13", "python": "37", "bitness": 64, "platform_id": "macosx_x86_64"},
              {"os": "macos-13", "python": "38", "bitness": 64, "platform_id": "macosx_x86_64"},
              {"os": "macos-13", "python": "39", "bitness": 64, "platform_id": "macosx_x86_64"},
              {"os": "macos-13", "python": "310", "bitness": 64, "platform_id": "macosx_x86_64"},
              {"os": "macos-13", "python": "311", "bitness": 64, "platform_id": "macosx_x86_64"},
              {"os": "macos-13", "python": "312", "bitness": 64, "platform_id": "macosx_x86_64"},
              {"os": "macos-13", "python": "313", "bitness": 64, "platform_id": "macosx_x86_64"}
            ]
          }'
          
          # If it's a PR or empty filter, use the full matrix
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ -z "$FILTER" ]; then
            FILTER_JSON="$FULL_MATRIX"
          else
            # Filter the matrix based on the input
            FILTERED_INCLUDES="["
            FILTER_PARTS=$(echo ",$FILTER," | tr ',' '\n')
            
            for row in $(echo "$FULL_MATRIX" | jq -c '.include[]'); do
              PYTHON=$(echo "$row" | jq -r '.python')
              PLATFORM=$(echo "$row" | jq -r '.platform_id')
              
              SHOULD_INCLUDE=false
              for part in $FILTER_PARTS; do
                if [ -n "$part" ]; then
                  if [ "$part" = "py$PYTHON" ] || [ "$part" = "$PLATFORM" ] || [ "$part" = "${PLATFORM}_py${PYTHON}" ]; then
                    SHOULD_INCLUDE=true
                    break
                  fi
                fi
              done
              
              if [ "$SHOULD_INCLUDE" = "true" ]; then
                if [ "$FILTERED_INCLUDES" != "[" ]; then
                  FILTERED_INCLUDES="$FILTERED_INCLUDES,"
                fi
                FILTERED_INCLUDES="$FILTERED_INCLUDES$row"
              fi
            done
            
            FILTERED_INCLUDES="$FILTERED_INCLUDES]"
            FILTER_JSON="{\"include\":$FILTERED_INCLUDES}"
          fi
          
          echo "matrix=$FILTER_JSON" >> $GITHUB_OUTPUT

  build_wheels:
    name: Build for cp${{ matrix.python }}-${{ matrix.platform_id }}
    needs: setup_matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup_matrix.outputs.matrix) }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Copy to C:\
        if: ${{ runner.os == 'Windows' }}
        run: |
          Copy-Item -Path D:\a\rdkix-pypi\rdkix-pypi -Destination C:\rdkix -Recurse

      - uses: actions/setup-python@v5
        name: Install Python
        with:
          python-version: '3.13'
      
      - name: Export GitHub Actions cache environment variables for vcpkg
        if: ${{ runner.os == 'Windows' }}
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      
      - name: Install libraries with vcpkg
        if: ${{ runner.os == 'Windows' }}
        run: |
          cd C:\\rdkix
          vcpkg --triplet x64-windows install

      - name: Install libraries with chocolatey
        if: ${{ runner.os == 'Windows' }}
        run: |
          choco install sed
          choco install pkgconfiglite --allow-empty-checksums
        shell: pwsh

      - name: Build wheels
        env:
          CIBW_BUILD: cp${{ matrix.python }}-${{ matrix.platform_id }}
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.manylinux_image }}
          CIBW_MANYLINUX_I686_IMAGE: ${{ matrix.manylinux_image }}

        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            cd C:\\rdkix
            echo "C:\\libs" >> $GITHUB_PATH
          fi
          python -m pip install cibuildwheel==2.22.0
          python -m cibuildwheel --output-dir wheelhouse
        shell: bash

      - name: Setup tmate session
        if: ${{ failure() }}
        uses: mxschmitt/action-tmate@v3

      - uses: actions/upload-artifact@v4
        if: ${{ runner.os == 'Windows' }}
        with:
          name: cp${{ matrix.python }}-${{ matrix.platform_id }}-${{ strategy.job-index }}
          path: C:\rdkix\wheelhouse\*.whl

      - uses: actions/upload-artifact@v4
        if: ${{ runner.os != 'Windows' }}
        with:
          name: cp${{ matrix.python }}-${{ matrix.platform_id }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
      

