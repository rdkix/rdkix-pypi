version: 2.1

parameters:
  python-target:
    type: string
    default: "all"
    description: "指定Python版本 (py38, py39, py310, py311, py312, py313或all)"

jobs:
  linux-arm64-wheels:
    working_directory: ~/linux-wheels
    machine:
      image: ubuntu-2004:current
      resource_class: arm.large
    parameters:
      python-version:
        type: string
    steps:
      - checkout
      - run:
          name: Build the ARM64 wheels on linux
          environment:
            CIBW_BUILD: cp<< parameters.python-version >>-manylinux_aarch64
            CIBW_ARCHS: aarch64
            CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
            CIBW_MANYLINUX_I686_IMAGE: manylinux2014

          command: |
            python3 -m pip install cibuildwheel==2.22.0
            python3 -m cibuildwheel --output-dir wheelhouse
      - store_artifacts:
          path: wheelhouse/

  # osx-wheels:
  #   working_directory: ~/osx-wheels
  #   macos:
  #     xcode: 15.4.0
  #   resource_class: macos.m1.medium.gen1
  #   parameters:
  #     python-version:
  #       type: string
  #   steps:
  #     - checkout
  #     - run:
  #         name: Build the OS X wheels.
  #         environment:
  #           CIBW_BUILD: cp<< parameters.python-version >>-macosx_arm64

  #         command: |
  #           pip3 install cibuildwheel==2.17.0
  #           cibuildwheel --output-dir wheelhouse
  #     - store_artifacts:
  #         path: wheelhouse/


workflows:
  all-tests:
    when: << pipeline.parameters.python-target >> != ""
    jobs:
      - linux-arm64-wheels:
          matrix:
            parameters:
              python-version: ["37", "38", "39", "310", "311", "312", "313"]
          filters:
            branches:
              only:
                - never-trigger-on-branch-push
          when:
            or:
              - equal: [ "all", << pipeline.parameters.python-target >> ]
              - equal: [ "py<< matrix.python-version >>", << pipeline.parameters.python-target >> ]
